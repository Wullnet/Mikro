<!DOCTYPE html>
<html lang="sq" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mikrobiologjia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Mikrobiologjia">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mikrobiologjia — Banka e Pyetjeve</title>
<style>
/* ============ THEME TOKENS ============ */
:root{
  --bg:#eef2f6; --bg2:#e3e9f0; --surface:#ffffff; --surface2:#f6f9fc;
  --text:#0f1e33; --muted:#5b6b82; --faint:#8595ab; --border:#e2e8f0; --border2:#eef2f7;
  --primary:#0d9488; --primary-d:#0b8177; --on-primary:#ffffff; --primary-soft:#d3f1ed;
  --good:#0f9d58; --good-soft:#d8f2e2; --bad:#e0413a; --bad-soft:#fbe0de; --warn:#c9820b; --warn-soft:#faedd2;
  --shadow:0 1px 2px rgba(16,30,51,.06),0 6px 20px rgba(16,30,51,.07);
  --shadow-lg:0 8px 40px rgba(16,30,51,.16);
  --radius:18px; --radius-sm:12px;
  --fs:1;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#0b1120; --bg2:#0e1526; --surface:#141d31; --surface2:#1b2740;
  --text:#e7eef8; --muted:#9fb0c9; --faint:#6f809a; --border:#26324b; --border2:#1f2a41;
  --primary:#2dd4bf; --primary-d:#25b6a4; --on-primary:#04201c; --primary-soft:#16342f;
  --good:#3ecf7a; --good-soft:#123021; --bad:#ff6b63; --bad-soft:#341715; --warn:#f0b445; --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 10px 44px rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#0b1120; --bg2:#0e1526; --surface:#141d31; --surface2:#1b2740;
    --text:#e7eef8; --muted:#9fb0c9; --faint:#6f809a; --border:#26324b; --border2:#1f2a41;
    --primary:#2dd4bf; --primary-d:#25b6a4; --on-primary:#04201c; --primary-soft:#16342f;
    --good:#3ecf7a; --good-soft:#123021; --bad:#ff6b63; --bad-soft:#341715; --warn:#f0b445; --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 10px 44px rgba(0,0,0,.55);
  }
}
/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:calc(16px*var(--fs)); line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit;font-size:inherit}
::selection{background:var(--primary-soft)}
/* scrollbar */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ============ LAYOUT ============ */
#app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
.appbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 12px) 16px 12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  display:flex;align-items:center;gap:12px;border-bottom:1px solid transparent;transition:border-color .2s;
}
.appbar.scrolled{border-color:var(--border)}
.appbar .brand{font-weight:800;letter-spacing:-.02em;font-size:1.06rem;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.appbar .brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-d));display:grid;place-items:center;flex:none;box-shadow:0 3px 10px color-mix(in srgb,var(--primary) 40%,transparent)}
.logo svg{width:18px;height:18px;color:var(--on-primary)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.iconbtn:hover,.iconbtn:active{background:var(--surface2);color:var(--text)}
.iconbtn svg{width:22px;height:22px}

main{padding:8px 16px calc(96px + var(--safe-b));animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ BOTTOM NAV ============ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:6px 8px calc(6px + var(--safe-b));
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
}
.tabbar-inner{max-width:640px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--faint);font-size:.66rem;font-weight:600;transition:color .15s}
.tab svg{width:24px;height:24px;transition:transform .15s}
.tab.active{color:var(--primary)}
.tab.active svg{transform:translateY(-1px)}
.tab:active svg{transform:scale(.86)}

/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow)}
.h-hero{margin:6px 0 18px}
.h-hero h1{font-size:1.5rem;letter-spacing:-.03em;margin:0 0 4px;font-weight:820}
.h-hero p{margin:0;color:var(--muted);font-size:.92rem}
.section-title{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:22px 4px 10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;background:var(--surface2);color:var(--text);transition:transform .12s,filter .15s,background .15s;border:1px solid var(--border2)}
.btn:active{transform:scale(.97)}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:var(--on-primary);border:none;box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 34%,transparent)}
.btn.primary:active{filter:brightness(.96)}
.btn.ghost{background:transparent;border:1px solid var(--border)}
.btn.block{display:flex;width:100%}
.btn.lg{padding:16px;font-size:1.02rem}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--border2);white-space:nowrap}
.pill.aud{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.cat{color:var(--on-primary)}

/* progress ring */
.ring{--p:0;width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--border) 0)}
.ring::before{content:"";position:absolute;width:78px;height:78px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-size:1.5rem;font-weight:820;letter-spacing:-.03em}
.ring span{position:relative;font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.05em}

/* home quick row */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick .btn{flex-direction:column;gap:8px;padding:18px 12px;align-items:flex-start;text-align:left;height:100%}
.quick .btn .k{font-size:.78rem;color:var(--muted);font-weight:600}
.quick .btn .v{font-weight:800}
.quick .btn svg{width:24px;height:24px;color:var(--primary)}
.quick .btn.primary svg{color:var(--on-primary)}
.quick .btn.primary .k{color:color-mix(in srgb,var(--on-primary) 78%,transparent)}

/* category list */
.catgrid{display:flex;flex-direction:column;gap:10px}
.catrow{display:flex;align-items:center;gap:13px;padding:14px;width:100%;text-align:left}
.catrow:active{transform:scale(.985)}
.catdot{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.05rem}
.catrow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.catrow .meta .nm{font-weight:750;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .meta .sub{font-size:.78rem;color:var(--muted);margin-top:2px}
.catrow .cprog{width:100%;height:5px;border-radius:4px;background:var(--border);margin-top:7px;overflow:hidden}
.catrow .cprog i{display:block;height:100%;border-radius:4px;background:var(--primary)}
.catrow .chev{color:var(--faint);flex:none}
.catrow .chev svg{width:20px;height:20px}

/* ============ STUDY CARD ============ */
.study-head{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.study-head .prog{font-variant-numeric:tabular-nums;font-weight:800;font-size:.9rem}
.study-head .bar{flex:1;height:6px;border-radius:4px;background:var(--border);overflow:hidden;min-width:60px}
.study-head .bar i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .3s}

.qcard{padding:20px 18px;min-height:230px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.qcard .topline{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.qcard .qid{font-size:.72rem;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.qcard .qtext{font-size:1.24rem;line-height:1.42;font-weight:720;letter-spacing:-.015em;flex:1;display:flex;align-items:center}
.qcard .qtext.small{font-size:1.08rem}
.reveal-hint{margin-top:16px;text-align:center;color:var(--faint);font-size:.82rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.reveal-hint svg{width:16px;height:16px}

.ans{margin-top:16px;animation:slideup .3s cubic-bezier(.2,.7,.3,1)}
@keyframes slideup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ans .lbl{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ans .lbl svg{width:15px;height:15px}
.ans .atext{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 26%,transparent);color:var(--text);padding:14px 15px;border-radius:14px;font-weight:640;font-size:1.06rem;line-height:1.45}
.extra{margin-top:12px;border-radius:13px;padding:12px 14px;font-size:.86rem;line-height:1.5}
.extra .x-lbl{font-weight:800;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;opacity:.85}
.extra.note{background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 24%,transparent)}
.extra.note .x-lbl{color:var(--warn)}
.extra.orig{background:var(--surface2);color:var(--muted);border:1px solid var(--border2)}
.extra.src{background:var(--surface2);color:var(--muted);border:1px solid var(--border2)}

/* option list (study context + quiz) */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;background:var(--surface2);border:1.5px solid var(--border2);text-align:left;width:100%;font-weight:600;transition:transform .1s,border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt .lt{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:800;font-size:.82rem;background:var(--surface);border:1px solid var(--border);text-transform:uppercase}
.opt .ot{flex:1}
.opt .ok{width:22px;height:22px;flex:none;opacity:0}
.opt.correct{background:var(--good-soft);border-color:var(--good)}
.opt.correct .lt{background:var(--good);color:#fff;border-color:var(--good)}
.opt.correct .ok{opacity:1;color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.wrong .ok{opacity:1;color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}

/* study action bar */
.study-actions{margin-top:16px;display:flex;gap:10px}
.study-actions .btn{flex:1}
.navbtns{display:flex;gap:10px;margin-top:10px}
.navbtns .btn{flex:1}
.navbtns .btn[disabled]{opacity:.4}

/* toolbar row (chips) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--border);font-weight:700;font-size:.82rem;white-space:nowrap;color:var(--muted);flex:none;transition:.15s}
.chip.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* segmented */
.seg{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:.86rem;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* quiz setup */
.field{margin-bottom:16px}
.field>label{display:block;font-weight:750;font-size:.9rem;margin-bottom:9px}
.count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count-grid button{padding:13px 4px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--border2);font-weight:800}
.count-grid button.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
html[data-theme="dark"] .count-grid button.active,html[data-theme="auto"] .count-grid button.active{color:var(--primary)}

/* quiz progress */
.qz-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qz-top .x{color:var(--muted)}
.qz-bar{flex:1;height:8px;border-radius:5px;background:var(--border);overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--primary);border-radius:5px;transition:width .35s}
.qz-score{font-weight:800;font-variant-numeric:tabular-nums;color:var(--good)}

/* result */
.result{text-align:center;padding:26px 18px}
.result .big{font-size:3.4rem;font-weight:850;letter-spacing:-.04em;line-height:1;margin:6px 0}
.result .lead{color:var(--muted);margin-bottom:4px;font-weight:600}
.result .emoji{font-size:3rem}
.result-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0}
.result-stats .s{padding:14px 6px;border-radius:13px;background:var(--surface2)}
.result-stats .s b{display:block;font-size:1.4rem;font-weight:820}
.result-stats .s span{font-size:.72rem;color:var(--muted);font-weight:600}

/* search */
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:15px;padding:12px 14px;position:sticky;top:calc(var(--safe-t) + 60px);z-index:10}
.searchbox:focus-within{border-color:var(--primary)}
.searchbox svg{width:20px;height:20px;color:var(--faint);flex:none}
.searchbox input{border:none;background:none;outline:none;flex:1;color:var(--text);min-width:0}
.searchbox .clr{color:var(--faint);font-weight:700;padding:2px 6px}

.result-item{padding:14px 16px;margin-bottom:10px;cursor:pointer}
.result-item .rq{font-weight:700;letter-spacing:-.01em;line-height:1.42}
.result-item .ra{margin-top:10px;color:var(--text);font-weight:600;background:var(--good-soft);padding:10px 12px;border-radius:11px;font-size:.94rem;border:1px solid color-mix(in srgb,var(--good) 22%,transparent)}
.result-item .rmeta{display:flex;align-items:center;gap:8px;margin-top:9px}
mark{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* empty state */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty svg{width:52px;height:52px;color:var(--border);margin-bottom:12px}
.empty b{display:block;color:var(--text);font-weight:750;margin-bottom:4px}

/* star */
.star{color:var(--faint);transition:transform .15s,color .15s}
.star.on{color:var(--warn)}
.star:active{transform:scale(1.25)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(6,12,24,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:640px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + var(--safe-b));
  transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);max-height:86vh;overflow:auto}
.sheet.open{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--border);margin:2px auto 16px}
.sheet h3{margin:0 0 14px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--border2)}
.set-row:first-of-type{border-top:none}
.set-row .si{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--muted)}
.set-row .si svg{width:20px;height:20px}
.set-row .st{flex:1}
.set-row .st b{font-weight:700}
.set-row .st span{display:block;font-size:.8rem;color:var(--muted)}

.fs-ctrl{display:flex;align-items:center;gap:2px;background:var(--surface2);border-radius:11px;padding:3px}
.fs-ctrl button{width:36px;height:34px;border-radius:8px;font-weight:800;font-size:1.1rem;display:grid;place-items:center}
.fs-ctrl button:active{background:var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);z-index:70;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:.88rem;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-lg);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

.fab-row{display:flex;gap:10px}
.hide{display:none!important}
.spacer{height:8px}
small.dim{color:var(--faint)}
</style>
</head>

<div id="app">
  <header class="appbar" id="appbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.5a4 4 0 0 1-.7 2.3L5 18a3 3 0 0 0 2.5 4.7h9A3 3 0 0 0 19 18l-4.3-6.2a4 4 0 0 1-.7-2.3V2"/><path d="M8 2h8"/><path d="M7.5 15h9"/></svg></span>
      <b id="appbar-title">Mikrobiologjia</b>
    </div>
    <button class="iconbtn" id="btn-settings" aria-label="Cilësimet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <div class="tabbar-inner" id="tabbar"></div>

function load(){
  try{
    var s=JSON.parse(localStorage.getItem(NS+'.store')); if(s) store=Object.assign(store,s);
    var p=JSON.parse(localStorage.getItem(NS+'.prefs')); if(p) prefs=Object.assign(prefs,p);
  }catch(e){}
}
function flush(){
  try{
    localStorage.setItem(NS+'.store', JSON.stringify(store));
    localStorage.setItem(NS+'.prefs', JSON.stringify(prefs));
  }catch(e){}
}
var saveT;
function persist(){
  try{ clearTimeout(saveT); saveT=setTimeout(flush,120); }catch(e){ flush(); }
}
load();
/* Save immediately whenever the app is closed, backgrounded, or the tab is hidden,
   so progress is never lost — even in the WhatsApp in-app browser. */
window.addEventListener('pagehide', flush);
window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') flush(); });

var $ = function(s,r){ return (r||document).querySelector(s); };
function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fold(s){ return String(s||'').toLowerCase()
  .replace(/ë/g,'e').replace(/ç/g,'c')
  .normalize('NFD').replace(/[̀-ͯ]/g,''); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function pct(n,d){ return d? Math.round(n/d*100):0; }
function count(o){ var n=0; for(var k in o) if(o[k]) n++; return n; }
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1600); }

function render(){
  applyPrefs();
  renderTabs();

function startStudy(cat, opt){
  opt=opt||{};
  var ids=Q.filter(function(q){ return cat==='all'||q.cat===cat; });
  var st={ cat:cat, filter:opt.filter||'all', shuffle:!!opt.shuffle, i:0, revealed:false };
  st.ids = buildStudyPool(cat, st.filter, st.shuffle);
  if(opt.startAt!=null){ var idx=st.ids.indexOf(opt.startAt); if(idx>=0) st.i=idx; }
  state.study=st; state.tab='study'; render();
}
function buildStudyPool(cat, filter, sh){
  var arr=Q.filter(function(q){
    if(cat!=='all' && q.cat!==cat) return false;
    if(filter==='unlearned' && store.learned[q.id]) return false;
    if(filter==='saved' && !store.saved[q.id]) return false;
    return true;
  }).map(function(q){return q.id;});
  return sh? shuffle(arr):arr;
}

  $$('[data-sfilter]').forEach(function(b){ b.onclick=function(){ st.filter=b.getAttribute('data-sfilter'); st.i=0; st.revealed=false; st.ids=buildStudyPool(st.cat,st.filter,st.shuffle); renderStudy(); }; });

/* =========================================================
   QUIZ
========================================================= */
function shortTerm(a){
  if(!a) return false;
  if(a.length>46) return false;
  if(/[;]/.test(a)) return false;
  if((a.match(/\./g)||[]).length>1) return false;
  if(a.split(/\s+/).length>7) return false;
  return true;
}
// build a quiz item: either real MCQ, generated MCQ, or self-graded recall
function makeQuizItem(q, pool){
  if(q.mode==='mcq' && q.opts && q.correct){
    return { q:q, kind:'mcq', opts:q.opts.slice(), correct:q.correct };
  }
  if(shortTerm(q.a)){
    // generate distractors from same-cat short answers
    var na=fold(q.a);
    var cand=pool.filter(function(x){ return x!==q && shortTerm(x.a) && fold(x.a)!==na; });
    // prefer same category
    var same=cand.filter(function(x){return x.cat===q.cat;});
    var base= same.length>=6? same : cand;
    var picks=[], usedN={}; usedN[na]=1;
    base=shuffle(base);
    for(var i=0;i<base.length && picks.length<3;i++){
      var f=fold(base[i].a); if(usedN[f]) continue; usedN[f]=1; picks.push(base[i].a);
    }
    if(picks.length===3){
      var all=shuffle([q.a].concat(picks));
      var letters=['a','b','c','d'];
      var opts=all.map(function(t,idx){return {letter:letters[idx], text:t};});
      var correct = opts.filter(function(o){return o.text===q.a;})[0].letter;
      return { q:q, kind:'mcq', opts:opts, correct:correct, gen:true };
    }
  }
  return { q:q, kind:'recall' };
}
function startQuiz(cfg){
  var pool=Q.filter(function(q){ return cfg.cat==='all'||q.cat===cfg.cat; });
  var src=pool;
  if(cfg.style==='mcq'){
    // only questions that can become multiple-choice
    src=pool.filter(function(q){ return (q.mode==='mcq'&&q.opts&&q.correct) || shortTerm(q.a); });
  }
  if(!src.length) src=pool;
  var pick=shuffle(src);
  var n = cfg.n==='all'? pick.length : Math.min(cfg.n, pick.length);
  pick=pick.slice(0,n);
  var list=pick.map(function(q){ return makeQuizItem(q, pool); });
  state.quiz={ list:list, i:0, answered:false, chosen:null, revealed:false, score:0, wrong:[], cfg:cfg };
  state.tab='quiz'; render();
}

      h+='<button class="btn block lg" data-act="recall-yes" style="background:var(--good);color:#fff">'+svg('check',20)+' Po, e dija</button></div>';
    }
  }
  v.innerHTML=h;
  bindQuiz();

function renderSearch(){
  var v=$('#view'), s=state.search;
  var h='<div class="searchbox">'+svg('search',20)+'<input id="q" placeholder="Kërko pyetje, baktere, ilaçe…" value="'+esc(s.q)+'" autocomplete="off" autocorrect="off" spellcheck="false"><button class="clr '+(s.q?'':'hide')+'" id="clr">'+svg('x',18)+'</button></div>';
  h+='<div class="chips" style="margin-top:12px">';
  [['all','Të gjitha']].concat(CAT_META.map(function(c){return [c.name,c.short];})).forEach(function(c){
    h+='<button class="chip'+(s.cat===c[0]?' active':'')+'" data-fcat="'+esc(c[0])+'">'+esc(c[1])+'</button>';
  });
  h+='</div><div id="results"></div>';
  v.innerHTML=h;
  var inp=$('#q');
  inp.oninput=function(){ s.q=inp.value; $('#clr').classList.toggle('hide',!s.q); doSearch(); };
  $('#clr').onclick=function(){ s.q=''; inp.value=''; inp.focus(); $('#clr').classList.add('hide'); doSearch(); };
  $$('[data-fcat]').forEach(function(b){ b.onclick=function(){ s.cat=b.getAttribute('data-fcat'); renderSearch(); }; });
  doSearch();
}
function doSearch(){
  var s=state.search, res=$('#results'); if(!res) return;
  var terms=fold(s.q).split(/\s+/).filter(Boolean);
  var out=Q.filter(function(q){
    if(s.cat!=='all' && q.cat!==s.cat) return false;
    if(!terms.length) return false;
    var hay=fold(q.q+' '+q.a);
    return terms.every(function(t){ return hay.indexOf(t)>=0; });
  });
  if(!terms.length){
    res.innerHTML = emptyState('Kërko në 1500 pyetje','Shkruaj një fjalë kyçe — p.sh. “Staphylococcus”, “kapsulë”, “malaria”.');
    return;
  }
  if(!out.length){ res.innerHTML=emptyState('Asnjë rezultat','Provo një term tjetër ose hiq filtrin e kategorisë.'); return; }
  var lim=out.slice(0,60);
  var h='<div style="color:var(--muted);font-size:.82rem;font-weight:600;margin:14px 2px 8px">'+out.length+' rezultate'+(out.length>60?' (po tregohen 60)':'')+'</div>';
  lim.forEach(function(q){ var c=CAT_BY[q.cat]||{color:'var(--primary)',short:q.cat};
    h+='<div class="card result-item" data-open="'+q.id+'"><div class="rq">'+hl(q.q,terms)+'</div><div class="ra">'+hl(q.a,terms)+'</div><div class="rmeta"><span class="pill cat" style="background:'+c.color+'">'+esc(c.short)+'</span><span class="pill">#'+q.id+'</span></div></div>';
  });
  res.innerHTML=h;
  $$('[data-open]').forEach(function(cardEl){ cardEl.onclick=function(){ openInStudy(cardEl.getAttribute('data-open')); }; });
}
function hl(text, terms){
  var out=esc(text);
  if(!terms.length) return out;
  // highlight by folded match positions
  var folded=fold(text), spans=[];
  terms.forEach(function(t){ var idx=0; while((idx=folded.indexOf(t,idx))>=0){ spans.push([idx,idx+t.length]); idx+=t.length; } });
  if(!spans.length) return out;
  spans.sort(function(a,b){return a[0]-b[0];});
  // merge & rebuild against ORIGINAL text (fold keeps length: NFD may change length, so guard)
  if(folded.length!==text.length) return out; // safety: skip hl if lengths differ
  var merged=[], last=null;
  spans.forEach(function(sp){ if(last && sp[0]<=last[1]){ last[1]=Math.max(last[1],sp[1]); } else { last=sp.slice(); merged.push(last); } });
  var r='',p=0;
  merged.forEach(function(m){ r+=esc(text.slice(p,m[0]))+'<mark>'+esc(text.slice(m[0],m[1]))+'</mark>'; p=m[1]; });
  r+=esc(text.slice(p));
  return r;
}
function openInStudy(id){ var q=qById(id); startStudy(q.cat,{startAt:id}); state.study.revealed=true; renderStudy(); }

/* =========================================================
   SAVED
========================================================= */
function viewSaved(){
  var ids=Q.filter(function(q){return store.saved[q.id];});
  if(!ids.length) return emptyState('Asgjë e ruajtur ende','Trokit yllin ⭐ te një pyetje gjatë mësimit për ta ruajtur këtu.');
  var h='<div class="h-hero" style="margin-bottom:10px"><h1>Të ruajtura</h1><p>'+ids.length+' pyetje të shënuara</p></div>';
  h+='<button class="btn primary block" style="margin-bottom:14px" data-act="study-saved">'+svg('book',20)+' Mëso të ruajturat</button>';
  ids.forEach(function(q){ var c=CAT_BY[q.cat]||{color:'var(--primary)',short:q.cat};
    h+='<div class="card result-item" data-open="'+q.id+'"><div class="rq">'+esc(q.q)+'</div><div class="ra">'+esc(q.a)+'</div><div class="rmeta"><span class="pill cat" style="background:'+c.color+'">'+esc(c.short)+'</span><button class="iconbtn star on" data-unsave="'+q.id+'" style="margin-left:auto;width:34px;height:34px">'+svg('star',18)+'</button></div></div>';
  });
  return h;
}

/* =========================================================
   SETTINGS SHEET
========================================================= */
function openSettings(){
  var total=Q.length, learned=count(store.learned), saved=count(store.saved);
  var h='<div class="grab"></div><h3>Cilësimet</h3>';
  // theme
  h+='<div class="set-row"><div class="si">'+svg('moon')+'</div><div class="st"><b>Tema</b><span>Pamja e aplikacionit</span></div>';
  h+='<div class="seg" style="width:180px">';
  [['auto','Auto'],['light','E ndritshme'],['dark','E errët']].forEach(function(o){ h+='<button class="'+(prefs.theme===o[0]?'active':'')+'" data-theme="'+o[0]+'" style="padding:8px 4px;font-size:.78rem">'+o[1]+'</button>'; });
  h+='</div></div>';
  // font size
  h+='<div class="set-row"><div class="si">'+svg('type')+'</div><div class="st"><b>Madhësia e tekstit</b><span>'+Math.round(prefs.fs*100)+'%</span></div>';
  h+='<div class="fs-ctrl"><button data-fs="-">A−</button><button data-fs="+" style="font-size:1.25rem">A+</button></div></div>';
  // stats
  h+='<div class="set-row"><div class="si">'+svg('check')+'</div><div class="st"><b>Përparimi</b><span>'+learned+' të mësuara · '+saved+' të ruajtura</span></div></div>';
  // reset
  h+='<div class="set-row"><div class="si">'+svg('reset')+'</div><div class="st"><b>Rivendos përparimin</b><span>Fshin të mësuarat, të ruajturat dhe rezultatet</span></div><button class="btn ghost" data-act="reset" style="color:var(--bad);border-color:var(--bad);padding:9px 14px">Fshi</button></div>';
  // about
  h+='<div class="set-row"><div class="si">'+svg('info')+'</div><div class="st"><b>Rreth</b><span>1500 pyetje · Faza 3 · audituar sipas Murray, Rosenthal &amp; Pfaller — Medical Microbiology, 8th ed. Funksionon pa internet.</span></div></div>';
  var sh=$('#sheet'); sh.innerHTML=h;
  openSheet();
  $$('[data-theme]',sh).forEach(function(b){ b.onclick=function(){ prefs.theme=b.getAttribute('data-theme'); persist(); applyPrefs(); openSettings(); }; });
  $$('[data-fs]',sh).forEach(function(b){ b.onclick=function(){ var d=b.getAttribute('data-fs')==='+'?.1:-.1; prefs.fs=Math.min(1.4,Math.max(.85,Math.round((prefs.fs+d)*10)/10)); persist(); applyPrefs(); openSettings(); }; });
  act('reset', function(){ if(confirm('Të fshihet i gjithë përparimi? Ky veprim s’kthehet.')){ store={learned:{},saved:{},best:{},seen:{}}; persist(); closeSheet(); toast('Përparimi u fshi'); render(); } }, sh);
}

/* =========================================================
   SHEET + SWIPE + BIND
========================================================= */
function openSheet(){ $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); }
function closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function act(name, fn, root){ var b=(root||document).querySelector('[data-act="'+name+'"]'); if(b) b.onclick=fn; }
function qById(id){ for(var i=0;i<Q.length;i++) if(Q[i].id===id) return Q[i]; }
function emptyState(title,sub){ return '<div class="empty">'+svg('search',52)+'<b>'+esc(title)+'</b>'+esc(sub)+'</div>'; }

function addSwipe(node, onLeft, onRight){
  var x0=null,y0=null;
  node.addEventListener('touchstart',function(e){ if(e.touches.length!==1)return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  node.addEventListener('touchend',function(e){ if(x0==null)return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.7){ if(dx<0)onLeft(); else onRight(); } x0=null; },{passive:true});
}

function bindView(){
  // generic tab / cat / act handlers present on static views (home, saved)
  $$('[data-tab]').forEach(function(b){ if(b.classList.contains('tab'))return; b.onclick=function(){ go(b.getAttribute('data-tab')); }; });
  $$('[data-cat]').forEach(function(b){ b.onclick=function(){ startStudy(b.getAttribute('data-cat')); }; });
  $$('[data-open]').forEach(function(b){ b.onclick=function(){ openInStudy(b.getAttribute('data-open')); }; });
  $$('[data-unsave]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); store.saved[b.getAttribute('data-unsave')]=0; persist(); render(); }; });
  act('continue', function(){
    if(store.last && store.last.qid) startStudy(store.last.cat||'all',{filter:store.last.filter||'all',startAt:store.last.qid});
    else startStudy('all',{filter:'unlearned'});
  });
  act('quick-quiz', function(){ startQuiz({cat:'all',n:10,style:'mcq'}); });
  act('random-study', function(){ startStudy('all',{shuffle:true}); });
  act('quiz-setup', function(){ state.quiz=null; go('quiz'); });
  act('study-saved', function(){ startStudy('all',{filter:'saved'}); });
}

/* =========================================================
   PREFS / THEME
========================================================= */
function applyPrefs(){
  document.documentElement.setAttribute('data-theme', prefs.theme);
  document.documentElement.style.setProperty('--fs', prefs.fs);
}

/* =========================================================
   NAV
========================================================= */
function go(tab){
  if(tab==='study' && !state.study) { state.tab='study'; render(); return; }
  if(tab==='quiz'){ state.tab='quiz'; render(); return; }
  state.tab=tab; render();
}
document.getElementById('tabbar').addEventListener('click',function(e){
  var t=e.target.closest('.tab'); if(!t)return; go(t.getAttribute('data-tab'));
});
$('#btn-settings').onclick=openSettings;
$('#scrim').onclick=closeSheet;

// appbar shadow on scroll
$('#view').addEventListener('scroll',function(){});
window.addEventListener('scroll',function(){ $('#appbar').classList.toggle('scrolled', window.scrollY>4); },{passive:true});

/* =========================================================
   BOOT
========================================================= */
applyPrefs();
render();
</script>
