<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<title>Traffic Rush</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traffic Rush">
<meta name="theme-color" content="#101318">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Saira+Extra+Condensed:wght@600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101318; color: #f4f1e8; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #controls, #ui { position: fixed; inset: 0; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; background: #101318;
    font: 800 2.4rem "Saira Extra Condensed", "Arial Narrow", sans-serif; letter-spacing: .06em; z-index: 10; }
  #loading small { font: 600 1rem Barlow, Arial, sans-serif; letter-spacing: 0; color: #a7afb9; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="controls"></div>
<div id="ui"></div>
<div id="loading">TRAFFIC RUSH<small>Duke ndërtuar qytetin…</small></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
